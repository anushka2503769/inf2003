[project]
name = "jobless-simulator-api"
version = "0.1.0"
description = "INF2003 Jobless Simulator API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.138.1",
    "fpdf2>=2.8.8",
    "lxml>=6.1.3",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.14.0",
    "pymongo>=4.18.0",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
