[project]
name = "jobless-simulator-api"
version = "0.1.0"
description = "INF2003 Jobless Simulator API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
